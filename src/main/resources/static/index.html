<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendador de Tarefas</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Agendador de Tarefas</h1>
  <div><a href="/swagger-ui.html" target="_blank" rel="noopener" class="muted">API docs</a>
    <button id="logout" class="ghost small hidden">Sair</button></div>
</header>

<main id="auth">
  <div class="card narrow">
    <div class="tabs">
      <button id="tabLogin">Entrar</button><button id="tabReg" class="ghost">Criar conta</button>
    </div>
    <form id="authForm">
      <div id="nameRow" class="hidden"><input id="aName" placeholder="Nome" maxlength="120" class="mb"></div>
      <input id="aEmail" type="email" placeholder="E-mail" required maxlength="254" class="mb">
      <input id="aPass" type="password" placeholder="Senha (mín. 8 caracteres)" required minlength="8" maxlength="72" class="mb2">
      <button class="full" id="authBtn">Entrar</button>
    </form>
  </div>
</main>

<main id="app" class="hidden">
  <div class="card">
    <h2>Perfil</h2>
    <div class="row"><input id="pName" placeholder="Nome" maxlength="120"><button id="saveProfile">Salvar</button></div>
    <div class="muted" id="pEmail"></div>
  </div>

  <div class="card">
    <h2>Tarefas</h2>
    <form id="taskForm">
      <div class="row"><input id="tTitle" placeholder="Título" required maxlength="200">
        <input id="tWhen" type="datetime-local" title="Agendar para"></div>
      <div class="row"><textarea id="tDesc" rows="2" placeholder="Descrição (opcional)" maxlength="2000"></textarea>
        <button>Adicionar</button></div>
    </form>
    <div class="row"><select id="tFilter"><option value="">Todos os status</option>
      <option>PENDING</option><option>IN_PROGRESS</option><option>DONE</option><option>CANCELED</option></select></div>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <h2>Endereços</h2>
    <form id="addrForm" class="row">
      <input id="cep" placeholder="CEP (ex: 01310-100)" required maxlength="9">
      <input id="num" placeholder="Número" required maxlength="20">
      <input id="comp" placeholder="Complemento" maxlength="120">
      <button>Adicionar</button>
    </form>
    <div id="addrs"></div>
  </div>

  <div class="card">
    <h2>Telefones</h2>
    <form id="phoneForm" class="row">
      <input id="phNum" placeholder="+5511999998888" required maxlength="16">
      <select id="phType"><option>MOBILE</option><option>HOME</option><option>WORK</option></select>
      <button>Adicionar</button>
    </form>
    <div id="phones"></div>
  </div>
</main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
