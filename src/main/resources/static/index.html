<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendador de Tarefas</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7385; --accent:#3b5bdb; --line:#e2e5ec; --danger:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:860px; margin:20px auto; padding:0 16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  input, select, textarea, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  input, select, textarea { width:100%; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:var(--danger); }
  button.small { padding:4px 8px; font-size:13px; }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  .row > button { flex:0 0 auto; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .muted { color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; background:#e7ecff; color:var(--accent); }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90%; }
  #toast.err { background:var(--danger); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Agendador de Tarefas</h1>
  <div><a href="/swagger-ui.html" target="_blank" class="muted">API docs</a>
    <button id="logout" class="ghost small hidden">Sair</button></div>
</header>

<main id="auth">
  <div class="card" style="max-width:380px;margin:auto;width:100%">
    <div class="tabs">
      <button id="tabLogin">Entrar</button><button id="tabReg" class="ghost">Criar conta</button>
    </div>
    <form id="authForm">
      <div id="nameRow" class="hidden"><input id="aName" placeholder="Nome" style="margin-bottom:8px"></div>
      <input id="aEmail" type="email" placeholder="E-mail" required style="margin-bottom:8px">
      <input id="aPass" type="password" placeholder="Senha (mín. 8 caracteres)" required style="margin-bottom:12px">
      <button style="width:100%" id="authBtn">Entrar</button>
    </form>
  </div>
</main>

<main id="app" class="hidden">
  <div class="card">
    <h2>Perfil</h2>
    <div class="row"><input id="pName" placeholder="Nome"><button id="saveProfile">Salvar</button></div>
    <div class="muted" id="pEmail"></div>
  </div>

  <div class="card">
    <h2>Tarefas</h2>
    <form id="taskForm">
      <div class="row"><input id="tTitle" placeholder="Título" required>
        <input id="tWhen" type="datetime-local" title="Agendar para"></div>
      <div class="row"><textarea id="tDesc" rows="2" placeholder="Descrição (opcional)"></textarea>
        <button>Adicionar</button></div>
    </form>
    <div class="row"><select id="tFilter"><option value="">Todos os status</option>
      <option>PENDING</option><option>IN_PROGRESS</option><option>DONE</option><option>CANCELED</option></select></div>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <h2>Endereços</h2>
    <form id="addrForm" class="row">
      <input id="cep" placeholder="CEP (ex: 01310-100)" required>
      <input id="num" placeholder="Número" required>
      <input id="comp" placeholder="Complemento">
      <button>Adicionar</button>
    </form>
    <div id="addrs"></div>
  </div>

  <div class="card">
    <h2>Telefones</h2>
    <form id="phoneForm" class="row">
      <input id="phNum" placeholder="+5511999998888" required>
      <select id="phType"><option>MOBILE</option><option>HOME</option><option>WORK</option></select>
      <button>Adicionar</button>
    </form>
    <div id="phones"></div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('token');
let registering = false;

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3500);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method = 'GET', body) {
  const res = await fetch(path, { method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && token) { logout(); throw new Error('Sessão expirada'); }
  if (!res.ok) {
    const p = await res.json().catch(() => ({}));
    const fields = p.errors ? ' — ' + Object.values(p.errors).join('; ') : '';
    throw new Error((p.detail || 'Erro ' + res.status) + fields);
  }
  return res.status === 204 ? null : res.json();
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

function show() {
  $('auth').classList.toggle('hidden', !!token);
  $('app').classList.toggle('hidden', !token);
  $('logout').classList.toggle('hidden', !token);
  if (token) loadAll();
}
function logout() { token = null; localStorage.removeItem('token'); show(); }
$('logout').onclick = logout;

function setMode(reg) {
  registering = reg;
  $('nameRow').classList.toggle('hidden', !reg);
  $('authBtn').textContent = reg ? 'Criar conta' : 'Entrar';
  $('tabLogin').className = reg ? 'ghost' : ''; $('tabReg').className = reg ? '' : 'ghost';
}
$('tabLogin').onclick = () => setMode(false);
$('tabReg').onclick = () => setMode(true);

$('authForm').onsubmit = run(async e => {
  e.preventDefault();
  const body = { email: $('aEmail').value, password: $('aPass').value };
  if (registering) body.name = $('aName').value;
  const r = await api(registering ? '/api/auth/register' : '/api/auth/login', 'POST', body);
  token = r.accessToken; localStorage.setItem('token', token); show();
});

async function loadAll() { await Promise.all([loadProfile(), loadTasks()]); }

async function loadProfile() {
  const p = await api('/api/users/me');
  $('pName').value = p.name; $('pEmail').textContent = p.email;
  $('addrs').innerHTML = p.addresses.map(a => `<div class="item"><div>${esc(a.street)}, ${esc(a.number)}
    ${a.complement ? '(' + esc(a.complement) + ')' : ''}<div class="muted">${esc(a.neighborhood)} · ${esc(a.city)}/${esc(a.state)} · CEP ${esc(a.cep)}</div></div>
    <button class="danger small" onclick="delAddr(${a.id})">Excluir</button></div>`).join('') || '<div class="muted">Nenhum endereço.</div>';
  $('phones').innerHTML = p.phones.map(x => `<div class="item"><div>${esc(x.number)} <span class="badge">${x.type}</span></div>
    <button class="danger small" onclick="delPhone(${x.id})">Excluir</button></div>`).join('') || '<div class="muted">Nenhum telefone.</div>';
}
$('saveProfile').onclick = run(async () => { await api('/api/users/me', 'PUT', { name: $('pName').value }); toast('Perfil salvo'); });

$('addrForm').onsubmit = run(async e => {
  e.preventDefault();
  await api('/api/users/me/addresses', 'POST', { cep: $('cep').value, number: $('num').value, complement: $('comp').value || null });
  e.target.reset(); loadProfile();
});
window.delAddr = run(async id => { await api('/api/users/me/addresses/' + id, 'DELETE'); loadProfile(); });

$('phoneForm').onsubmit = run(async e => {
  e.preventDefault();
  await api('/api/users/me/phones', 'POST', { number: $('phNum').value, type: $('phType').value });
  e.target.reset(); loadProfile();
});
window.delPhone = run(async id => { await api('/api/users/me/phones/' + id, 'DELETE'); loadProfile(); });

async function loadTasks() {
  const f = $('tFilter').value;
  const r = await api('/api/tasks?size=100' + (f ? '&status=' + f : ''));
  $('tasks').innerHTML = r.items.map(t => `<div class="item"><div><strong>${esc(t.title)}</strong>
    <div class="muted">${esc(t.description || '')} ${t.scheduledFor ? '· ' + new Date(t.scheduledFor).toLocaleString('pt-BR') : ''}</div></div>
    <div class="row" style="flex:0 0 auto;margin:0"><select onchange="setStatus('${t.id}', this.value)">
      ${['PENDING','IN_PROGRESS','DONE','CANCELED'].map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <button class="danger small" onclick="delTask('${t.id}')">Excluir</button></div></div>`).join('')
    || '<div class="muted">Nenhuma tarefa.</div>';
}
$('tFilter').onchange = run(loadTasks);
$('taskForm').onsubmit = run(async e => {
  e.preventDefault();
  const when = $('tWhen').value;
  await api('/api/tasks', 'POST', { title: $('tTitle').value, description: $('tDesc').value || null,
    scheduledFor: when ? new Date(when).toISOString() : null });
  e.target.reset(); loadTasks();
});
window.setStatus = run(async (id, status) => { await api(`/api/tasks/${id}/status`, 'PATCH', { status }); toast('Status atualizado'); });
window.delTask = run(async id => { await api('/api/tasks/' + id, 'DELETE'); loadTasks(); });

show();
</script>
</body>
</html>
