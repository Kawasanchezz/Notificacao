name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskscheduler
          POSTGRES_USER: taskscheduler
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskscheduler" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      MONGODB_URI: mongodb://localhost:27017/taskscheduler
      JWT_SECRET: ci-only-signing-key-0123456789-abcdefghijklmnop
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (working tree and history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --no-banner --redact
