services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskscheduler
      POSTGRES_USER: taskscheduler
      POSTGRES_PASSWORD: taskscheduler
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskscheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the BFF in Docker too -> docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    ports: ["8080:8080"]
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/taskscheduler
      MONGODB_URI: mongodb://mongo:27017/taskscheduler
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  postgres-data:
  mongo-data:
